  <body class="bg-slate-950 text-slate-100 select-none antialiased min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <script>
      // Force update Service Worker to clear old cache v1/v2/v3
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          for (const reg of registrations) {
            reg.update();
          }
        });
        window.addEventListener('load', () => {
          const swPath = window.location.pathname.endsWith('/')
            ? window.location.pathname + 'sw.js'
            : window.location.pathname.replace(/\/[^\/]*$/, '/sw.js');
          navigator.serviceWorker.register(swPath).then(reg => {
            reg.update();
          }).catch(err => {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
  </body>
</html>
